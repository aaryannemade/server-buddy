# XIAO ESP32-C3 + Logger HAT (SKU 114993446) battery-sensing bench config.
# Based on xiao-logger-hat-espnow.yaml; retains its device name, existing
# node key, sensor numbers 1-3 and boot event number 4 for an in-place update.
# Do not flash until a 1-cell LiPo is attached to the HAT's BAT+/GND pads.
# No deep sleep yet: a timed sleep could interrupt the last application ACK.
# A battery-only soak needs ACK-gated sleep in the server_buddy component.
#
# The HAT's existing 1:2 divider presents Vbat/2 on XIAO D1 (GPIO3, ADC1).
# GPIO10 enables the sensor/divider rail. The ADC reads the divided voltage;
# the multiply filter reconstructs cell voltage. Compare with a multimeter
# before relying on the reading. Percentage is a rough 1-cell LiPo estimate.

external_components:
  - source:
      type: git
      url: https://github.com/aaryannemade/server-buddy.git
      ref: main
      path: esphome/components
    components: [server_buddy]
    refresh: 0s

esphome:
  name: xiao-logger-hat-espnow
  friendly_name: XIAO Logger HAT (Server Buddy)
  on_boot:
    - priority: 700
      then:
        - output.turn_on: logger_hat_power
        - lambda: 'delay(50);' # hold setup until SHT40/BH1750 have power

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

output:
  - platform: gpio
    id: logger_hat_power
    pin: GPIO10 # D10: HAT sensors and battery divider power

i2c:
  id: hat_i2c
  sda: GPIO6 # D4
  scl: GPIO7 # D5
  scan: true

sensor:
  - platform: sht4x
    id: sht40
    i2c_id: hat_i2c
    address: 0x44
    temperature:
      name: Temperature
      id: logger_temperature
    humidity:
      name: Humidity
      id: logger_humidity
    update_interval: 30s

  - platform: bh1750
    i2c_id: hat_i2c
    address: 0x23
    name: Illuminance
    id: logger_illuminance
    update_interval: 30s

  - platform: internal_temperature
    name: Chip Temperature
    id: chip_temperature
    entity_category: diagnostic
    update_interval: 30s

  - platform: adc
    pin: GPIO3 # D1: HAT's Vbat/2 output; no direct battery connection
    name: Battery Voltage
    id: battery_voltage
    attenuation: 12db
    samples: 16
    sampling_mode: avg
    update_interval: 30s
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - multiply: 2.0 # undo the HAT's 1:2 divider

  - platform: template
    name: Battery Level
    id: battery_level
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(battery_voltage).has_state()) return NAN;
      // Approximate LiPo level; calibrate from measured discharge data.
      return std::max(0.0f, std::min(100.0f,
                      (id(battery_voltage).state - 3.0f) * (100.0f / 1.2f)));

binary_sensor:
  - platform: gpio
    name: Boot Button
    id: boot_button
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true

text_sensor:
  - platform: version
    name: ESPHome Version
    id: esphome_version
    hide_timestamp: true
    entity_category: diagnostic

espnow:
  id: espnow_radio
  channel: 1 # the P4/C6 hub, not a Wi-Fi AP
  peers:
    - 14:C1:9F:01:DD:18

server_buddy:
  espnow_id: espnow_radio
  hub_mac: 14:C1:9F:01:DD:18
  node_key: !secret server_buddy_node_key
  report_interval: 30s
  boot_event_number: 4
  sensors:
    - id: logger_temperature
      number: 1
    - id: logger_humidity
      number: 2
    - id: logger_illuminance
      number: 3
    - chip_temperature
    - battery_voltage
    - battery_level
  binary_sensors:
    - boot_button
  text_sensors:
    - esphome_version
